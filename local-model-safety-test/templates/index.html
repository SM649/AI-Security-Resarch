<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Local Model Jailbreak Comparison Tool</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1>Jailbreak Comparison — qwen2.5-coder:7b</h1>
    <div class="controls">
      <label for="template-select">Box 2 template:</label>
      <select id="template-select">
        {% for id, tpl in templates.items() %}
        <option value="{{ id }}">{{ tpl.label }}</option>
        {% endfor %}
      </select>
    </div>
  </header>

  <div class="body">
    <aside id="sidebar">
      <button id="new-session-btn">+ New Session</button>
      <ul id="session-list"></ul>
    </aside>

    <div class="content">
      <main class="panels">
        <section class="panel">
          <h2>Box 1 — Baseline (raw message)</h2>
          <div id="baseline-log" class="log"></div>
        </section>
        <section class="panel">
          <h2>Box 2 — Injected (jailbreak template)</h2>
          <div id="injected-log" class="log"></div>
        </section>
      </main>

      <footer>
        <textarea id="message-input" placeholder="Type a message to send to both panels..."></textarea>
        <select id="target-select">
          <option value="both" selected>Send to: Both</option>
          <option value="baseline">Send to: Box 1 only</option>
          <option value="injected">Send to: Box 2 only</option>
        </select>
        <button id="send-btn">Send</button>
      </footer>
    </div>
  </div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
